<div class="login-page">
  <section class="login-card">
    <div class="login-brand">
      <div class="brand">CampusRecursos</div>
      <div class="brand-sub">Gestión de reservas y recursos</div>
      <p class="brand-text">
        Reserva espacios, gestiona préstamos de equipos y reporta incidentes del campus desde un solo lugar.
      </p>
    </div>

    <form class="login-form" (ngSubmit)="iniciarSesion()" novalidate>
      <h1>Iniciar sesión</h1>
      <p class="hint">Usa tu nombre de usuario, código institucional o correo.</p>

      @if (aviso()) {
        <div class="alert alert-info" role="status">{{ aviso() }}</div>
      }
      @if (error()) {
        <div class="alert alert-error" role="alert">{{ error() }}</div>
      }

      <label for="username">Usuario</label>
      <input
        id="username"
        name="username"
        type="text"
        autocomplete="username"
        [(ngModel)]="username"
        [disabled]="enviando()"
        placeholder="usuario, código o correo"
        autofocus
        required
      />

      <label for="password">Contraseña</label>
      <div class="password-field">
        <input
          id="password"
          name="password"
          [type]="mostrarPassword() ? 'text' : 'password'"
          autocomplete="current-password"
          [(ngModel)]="password"
          [disabled]="enviando()"
          placeholder="••••••••"
          required
        />
        <button type="button" class="toggle" (click)="alternarPassword()" [attr.aria-pressed]="mostrarPassword()">
          {{ mostrarPassword() ? 'Ocultar' : 'Mostrar' }}
        </button>
      </div>

      <button class="btn-primary" type="submit" [disabled]="enviando()">
        {{ enviando() ? 'Ingresando…' : 'Ingresar' }}
      </button>
    </form>
  </section>
</div>
