<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Mis préstamos')}"></head>
<body>
<div class="layout">

  <aside th:replace="~{fragments/layout :: sidebar('prestamos')}"></aside>

  <main class="main">
    <header th:replace="~{fragments/layout :: topbar('Mis préstamos', ${usuario})}"></header>

    <section class="content">
      <div class="page-head">
      <div class="intro">
        <h1>Mis préstamos</h1>
        <p>Consulta el estado de los equipos que has solicitado en préstamo y su fecha límite de devolución.</p>
      </div>
      <a class="btn btn--primary" th:href="@{/prestamos/nuevo}">Registrar préstamo</a>
    </div>

      <div class="card">
        <table class="tabla">
          <thead>
          <tr>
            <th class="col-equipo">Equipo</th>
            <th>Entrada</th>
            <th>Fecha límite</th>
            <th>Estado</th>
            <th class="ta-right">Devolución</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="p : ${prestamos}">
            <td class="td-equipo" th:text="${p.recurso}">Equipo</td>
            <td class="td-fecha" th:text="${#temporals.format(p.fechaEntrega, 'dd/MM/yyyy')}">dd/mm/aaaa</td>
            <td class="td-fecha" th:text="${#temporals.format(p.fechaDevolucionEstimada, 'dd/MM/yyyy')}">dd/mm/aaaa</td>
            <td>
              <span th:replace="~{fragments/layout :: tag(${p.estado}, ${p.estadoColor})}">Estado</span>
            </td>
            <td class="ta-right">
              <span th:replace="~{fragments/layout :: tag(${p.puntualidad}, ${p.puntualidadColor})}">Devolución</span>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(prestamos)}">
            <td colspan="5" class="empty">No tienes préstamos registrados.</td>
          </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>
</body>
</html>
