<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Recursos')}"></head>
<body>
<div class="layout">
  <aside th:replace="~{fragments/layout :: sidebar('admin')}"></aside>
  <div class="main">
    <header th:replace="~{fragments/layout :: topbar('Recursos', ${usuario})}"></header>

    <section class="content">
      <div class="intro intro--tight">
        <h1>Administraci&oacute;n de recursos</h1>
        <p>Gestiona los espacios y equipos institucionales registrados en el sistema.</p>
      </div>

      <div class="card">
        <table class="tabla">
          <thead>
            <tr>
              <th class="col-equipo">Recurso</th>
              <th>Categor&iacute;a</th>
              <th>Ubicaci&oacute;n</th>
              <th>Tipo</th>
              <th class="ta-right">Estado</th>
              <th class="ta-right">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="r : ${recursos}">
              <td class="td-equipo" th:text="${r.nombre}">Recurso</td>
              <td th:text="${r.categoria.nombre}">Categor&iacute;a</td>
              <td class="td-diagnostico" th:text="${r.ubicacion.nombre}">Ubicaci&oacute;n</td>
              <td class="td-diagnostico" th:text="${r.tipo}">Tipo</td>
              <td class="ta-right">
                <span th:replace="~{fragments/layout :: tag(${r.estado}, ${r.estadoColor})}"></span>
              </td>
              <td class="ta-right acciones">
                <a class="link-action" th:href="@{/recursos/editar/{id}(id=${r.idRecurso})}">Editar</a>
                <form class="inline-form" method="get" th:action="@{/recursos/eliminar/{id}(id=${r.idRecurso})}">
                  <button class="link-action link-action--danger" type="submit">Eliminar</button>
                </form>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(recursos)}">
              <td class="empty" colspan="6">No hay recursos registrados.</td>
            </tr>
          </tbody>
        </table>
      </div>

      <a class="btn btn--primary btn--sm" th:href="@{/recursos/nuevo}">+ Nuevo recurso</a>
    </section>
  </div>
</div>
</body>
</html>
