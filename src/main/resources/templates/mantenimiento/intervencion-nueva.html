<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Nueva intervención')}"></head>
<body>
<div class="layout">
  <aside th:replace="~{fragments/layout :: sidebar('mantenimiento')}"></aside>
  <div class="main">
    <header th:replace="~{fragments/layout :: topbar('Nueva intervención', ${usuario})}"></header>

    <section class="content content--center">
      <form class="form-card" method="post" th:action="@{/mantenimiento}" th:object="${intervencion}">
        <h1 class="form-card__title">Nueva intervenci&oacute;n</h1>
        <p class="form-card__sub">El recurso quedar&aacute; bloqueado como &ldquo;En mantenimiento&rdquo; hasta que finalices la intervenci&oacute;n.</p>

        <div class="alerta alerta--error" th:if="${error != null}">
          <span class="alerta__icono">&#9888;</span>
          <span th:text="${error}">Error.</span>
        </div>

        <div class="field">
          <label for="recursoId">Recurso</label>
          <select id="recursoId" th:field="*{recursoId}" required>
            <option value="">Selecciona un recurso</option>
            <option th:each="r : ${recursos}" th:value="${r.idRecurso}" th:text="${r.nombre}">Recurso</option>
          </select>
        </div>

        <div class="field">
          <label for="diagnostico">Diagn&oacute;stico</label>
          <textarea id="diagnostico" rows="3" th:field="*{diagnostico}"
                    placeholder="Describe la falla o el mantenimiento que requiere el recurso."></textarea>
        </div>

        <div class="form-actions">
          <a class="btn btn--ghost" th:href="@{/mantenimiento}">Cancelar</a>
          <button class="btn btn--primary" type="submit">Registrar intervenci&oacute;n</button>
        </div>
      </form>
    </section>
  </div>
</div>
</body>
</html>
