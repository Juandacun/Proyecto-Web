<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Tablero e indicadores')}"></head>
<body>
<div class="layout">
  <aside th:replace="~{fragments/layout :: sidebar('tablero')}"></aside>
  <div class="main">
    <header th:replace="~{fragments/layout :: topbar('Tablero e indicadores', ${usuario})}"></header>

    <section class="content">
      <div class="intro intro--tight">
        <h1>Tablero operativo</h1>
        <p>N&uacute;mero de reservas por recurso y por categor&iacute;a.</p>
      </div>

      <div class="card">
        <table class="tabla">
          <thead>
            <tr>
              <th>Recurso</th>
              <th>Categor&iacute;a</th>
              <th class="ta-right">N&ordm; de reservas</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="f : ${filas}">
              <td class="td-equipo" th:text="${f.recurso}">Recurso</td>
              <td th:text="${f.categoria}">Categor&iacute;a</td>
              <td class="ta-right" th:text="${f.reservas}">0</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>
</div>
</body>
</html>
